[project]
name = "gsi"
version = "0.1.0"
description = "Serialization-invariance audit of LLM graph code generation"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.2",
    "pandas>=2.0",
    "pyyaml>=6",
    "openai>=1.40",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
erdos = ["datasets>=2.19"]
stats = ["scipy>=1.11", "statsmodels>=0.14"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
